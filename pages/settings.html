<!-- PAGE: settings -->
<link rel="stylesheet" href="css/pages/settings.css">
<section class="page page-settings" data-page="settings">
  <h1 class="page-title">Settings</h1>

  <div class="card">
    <h2 class="card-title">Machine name</h2>
    <p id="machine-note" class="card-note"></p>
    <div class="radio-group" role="radiogroup" aria-label="Uri ng machine name">
      <label class="radio-row"><input type="radio" name="machine-mode" value="user-input"> User input</label>
      <label class="radio-row"><input type="radio" name="machine-mode" value="lead-pc"> Lead PC</label>
    </div>
    <div class="form-group">
      <label class="form-label" for="machine-name">Pangalan ng machine</label>
      <input id="machine-name" class="form-input" type="text" maxlength="30" autocomplete="off">
    </div>
  </div>

  <div class="card">
    <h2 class="card-title">Folders</h2>
    <div class="folder-row">
      <div><p class="form-label">Save folder (piliin ang BMWW)</p><p class="card-note">Settings ay isasave sa C:\desktop\BMWW\settings</p><p id="root-label" class="folder-name"></p></div>
      <button id="pick-root" class="btn btn-secondary" type="button">Piliin ang folder</button>
    </div>
    <div class="folder-row">
      <div><p class="form-label">Data source folder</p><p class="card-note">Dito kukunin ang data.</p><p id="source-label" class="folder-name"></p></div>
      <button id="pick-source" class="btn btn-secondary" type="button">Piliin ang folder</button>
    </div>
  </div>

  <button id="save-settings" class="btn btn-primary" type="button">Save settings</button>
  <p id="settings-status" class="status" role="status"></p>
</section>
<script type="module" src="js/pages/settings.js"></script>
